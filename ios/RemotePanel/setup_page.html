<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RemotePanel 设置</title>
<style>
body{font-family:-apple-system,"Segoe UI",sans-serif;background:#eef3fb;color:#14213d;margin:0}
main{max-width:880px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 6px}
h2{font-size:16px;margin:0 0 8px}
p{color:#445;font-size:14px}
.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 4px rgba(20,40,80,.08)}
label{display:block;font-size:13px;color:#445;margin:10px 0 4px}
input[type=text],input[type=number],select{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #c5d0e0;border-radius:8px;font-size:14px;background:#fff}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.page{border-top:1px solid #e6edf5;padding-top:12px;margin-top:12px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:auto}
button{background:#1a6fe8;color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:16px;cursor:pointer}
#msg{min-height:22px;margin:8px 0;font-size:14px}
.narrow{width:120px}
</style>
</head>
<body>
<main>
<h1>RemotePanel 设置</h1>
<p>这里改的就是 iPad 上的设置。保存后，iPad 会按新内容重新拉取。</p>
<div id="msg"></div>
<div id="app">正在读取…</div>
<button id="save" type="button">保存到 iPad</button>
</main>
<script>
var state;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function opt(choices,titles,cur){
  var h="", n=Number(cur);
  for(var i=0;i<choices.length;i++){
    h+="<option value=\""+choices[i]+"\""+(Number(choices[i])===n?" selected":"")+">"+esc(titles[i])+"</option>";
  }
  return h;
}
function uploadVideo(){
  var input=document.getElementById("vfile"), msg=document.getElementById("vmsg");
  if(!input||!input.files||!input.files[0]){ if(msg) msg.textContent="先选择一个 mp4、mov 或 m4v。"; return; }
  var file=input.files[0], name=file.name||"clip.mp4", chunk=100000, seq=0;
  if(!file.size){ if(msg) msg.textContent="文件是空的。"; return; }
  if(file.size>200*1024*1024){ if(msg) msg.textContent="单个文件请小于 200MB。"; return; }
  if(msg) msg.textContent="正在上传…";
  function step(){
    var end=Math.min(file.size,(seq+1)*chunk), last=end>=file.size?1:0, blob=file.slice(seq*chunk,end);
    fetch("/video-chunk?name="+encodeURIComponent(name)+"&seq="+seq+"&last="+last,{method:"POST",body:blob})
      .then(function(r){return r.text().then(function(t){if(!r.ok) throw new Error(t||"失败");});})
      .then(function(){
        if(last){ if(msg) msg.textContent="已上传。来源选「上传到这台 iPad」，并勾选视频页的显示。"; return; }
        seq++; if(msg) msg.textContent="正在上传… "+Math.round(end*100/file.size)+"%"; step();
      }).catch(function(e){ if(msg) msg.textContent="上传失败："+(e&&e.message?e.message:""); });
  }
  step();
}
function render(){
  var ch=state.refresh_choices, ti=state.refresh_titles, h="";
  h+="<div class=\"card\"><h2>连接</h2><label>HTTP / SOCKS 代理</label><input id=\"proxy\" type=\"text\" value=\""+esc(state.proxy)+"\">";
  h+="<label>代理用户名（代理不需要登录就留空）</label><input id=\"proxyUser\" type=\"text\" autocomplete=\"off\" value=\""+esc(state.proxy_user||"")+"\">";
  h+="<label>代理密码"+(state.proxy_pass_set?"（已保存，留空则不改）":"")+"</label><input id=\"proxyPass\" type=\"password\" autocomplete=\"new-password\" value=\"\">";
  if(state.proxy_pass_set) h+="<label class=\"check\"><input id=\"proxyPassClear\" type=\"checkbox\"> 清除已保存的代理密码</label>";
  h+="<label>全局停留秒（0 表示用每一页自己的秒数）</label><input id=\"dwell\" class=\"narrow\" type=\"number\" value=\""+esc(state.dwell_override)+"\"></div>";
  h+="<div class=\"card\"><h2>消息</h2><label>走马灯地址（JSON、纯文本或 RSS，留空则不显示）</label><input id=\"ticker\" type=\"text\" value=\""+esc(state.ticker_url)+"\">";
  h+="<label class=\"check\"><input id=\"tickerProxy\" type=\"checkbox\""+(state.ticker_proxy?" checked":"")+"> 使用代理</label>";
  h+="<label>多久拉一次</label><select id=\"tickerRefresh\">"+opt(ch,ti,state.ticker_refresh)+"</select></div>";
  h+="<div class=\"card\"><h2>VPS 流量</h2><label>接口地址</label><input id=\"vps\" type=\"text\" value=\""+esc(state.vps_url)+"\">";
  h+="<label>Token</label><input id=\"vpsToken\" type=\"text\" value=\""+esc(state.vps_token)+"\">";
  h+="<label class=\"check\"><input id=\"vpsProxy\" type=\"checkbox\""+(state.vps_proxy?" checked":"")+"> 使用代理</label>";
  h+="<label>流量更新</label><select id=\"vpsRefresh\">"+opt(ch,ti,state.vps_refresh)+"</select></div>";
  h+="<div class=\"card\"><h2>相册</h2><label>本地相册 A / B 使用的相册</label><select id=\"album\"><option value=\"\">默认（收藏夹或图库）</option>";
  (state.albums||[]).forEach(function(a){
    h+="<option value=\""+esc(a.id)+"\""+(a.id===state.album_id?" selected":"")+">"+esc(a.title)+"</option>";
  });
  if(!(state.albums||[]).length) h+="</select><p>还没有读到相册列表。iPad 需要先允许访问照片。</p></div>";
  else h+="</select></div>";
  h+="<div class=\"card\"><h2>视频</h2>";
  h+="<p>有两个视频页：「相册视频」和「网络视频」，默认都不显示，到下面的页面列表里勾选「显示」。每次随机播一段，默认静音，播完再翻页。只支持 H.264 的 mp4、mov、m4v，建议 1080p 以内。</p>";
  h+="<label class=\"check\"><input id=\"vmuted\" type=\"checkbox\""+(state.video_muted!==false?" checked":"")+"> 播放时静音</label>";
  h+="<h3>相册视频</h3><label>放哪里的视频</label><select id=\"vsource\">";
  h+="<option value=\"album\""+(state.video_source!=="files"?" selected":"")+">相册里的视频</option>";
  h+="<option value=\"files\""+(state.video_source==="files"?" selected":"")+">上传到这台 iPad 的视频</option></select>";
  h+="<label>相册（留空则用上面选的相册；那个相册没有视频时，再用全部视频）</label><select id=\"valbum\"><option value=\"\">跟随上面的相册</option>";
  (state.albums||[]).forEach(function(a){
    h+="<option value=\""+esc(a.id)+"\""+(a.id===state.video_album?" selected":"")+">"+esc(a.title)+"</option>";
  });
  h+="</select>";
  h+="<h3>网络视频</h3><label>视频目录（HTTP 目录列表或 WebDAV）</label><input id=\"vhttp\" type=\"text\" value=\""+esc(state.video_http)+"\" placeholder=\"http://192.168.28.30/videos/\">";
  h+="<label>目录用户名（不需要登录就留空）</label><input id=\"vhttpUser\" type=\"text\" autocomplete=\"off\" value=\""+esc(state.video_http_user||"")+"\">";
  h+="<label>目录密码"+(state.video_http_pass_set?"（已保存，留空则不改）":"")+"</label><input id=\"vhttpPass\" type=\"password\" autocomplete=\"new-password\" value=\"\">";
  h+="<p>群晖、威联通等 NAS 打开 WebDAV 后填它的地址即可。iPad 读不了 SMB（\\\\电脑\\共享），请改用 HTTP 或 WebDAV。</p>";
  h+="<label>最长播放（分钟，0 表示播完再翻页）</label><input id=\"vmax\" class=\"narrow\" type=\"number\" value=\""+esc(state.video_max)+"\">";
  h+="<label>已经上传的视频</label>";
  if(!(state.video_files||[]).length) h+="<p>还没有上传。</p>";
  else (state.video_files||[]).forEach(function(f){
    h+="<label class=\"check\"><input type=\"checkbox\" class=\"vdel\" data-name=\""+esc(f.name)+"\"> 删除 "+esc(f.name)+" （"+esc(f.mb)+" MB）</label>";
  });
  h+="<label>从这台电脑上传</label><input id=\"vfile\" type=\"file\" accept=\".mp4,.mov,.m4v,video/mp4,video/quicktime\">";
  h+="<p><button id=\"vupload\" type=\"button\">上传到 iPad</button></p><p id=\"vmsg\"></p></div>";
  h+="<div class=\"card\"><h2>页面</h2>";
  (state.pages||[]).forEach(function(pg,i){
    h+="<div class=\"page\" data-i=\""+i+"\"><div class=\"row\"><strong>"+esc(pg.title)+"</strong>";
    h+="<label class=\"check\"><input type=\"checkbox\" class=\"en\""+(pg.enabled?" checked":"")+"> 显示</label>";
    h+="<label class=\"check\">停留 <input class=\"dw narrow\" type=\"number\" value=\""+esc(pg.dwell)+"\"> 秒</label></div>";
    if(pg.id==="local-video"||pg.id==="net-video") h+="<p>这里的秒数只在没有视频可播时使用。正在播放时会播完，或到达上面的最长播放，再翻页。</p>";
    if(pg.has_source){
      h+="<label>"+esc(pg.hint||"接口")+"</label><input class=\"url\" type=\"text\" value=\""+esc(pg.url)+"\">";
      if(pg.api_key!=null){
        h+="<label>API Key</label><input class=\"akey\" type=\"text\" value=\""+esc(pg.api_key)+"\">";
        h+="<label>模型</label><input class=\"model\" type=\"text\" value=\""+esc(pg.model)+"\">";
      }
      h+="<label class=\"check\"><input type=\"checkbox\" class=\"px\""+(pg.use_proxy?" checked":"")+"> 使用代理</label>";
      if(pg.refresh_shared) h+="<p>数据更新与「Steam 新游」共用。</p>";
      else if(pg.refresh_period) h+="<p>早上、中午、晚上各请求一次。</p>";
      else h+="<label>数据更新</label><select class=\"rf\">"+opt(ch,ti,pg.refresh)+"</select>";
    }
    h+="</div>";
  });
  h+="</div>";
  document.getElementById("app").innerHTML=h;
  var up=document.getElementById("vupload");
  if(up) up.onclick=uploadVideo;
}
function collect(){
  var body=JSON.parse(JSON.stringify(state));
  body.proxy=document.getElementById("proxy").value;
  body.proxy_user=document.getElementById("proxyUser").value;
  body.proxy_pass=document.getElementById("proxyPass").value;
  var ppc=document.getElementById("proxyPassClear"); body.proxy_pass_clear=!!(ppc&&ppc.checked);
  body.dwell_override=Number(document.getElementById("dwell").value)||0;
  body.ticker_url=document.getElementById("ticker").value;
  body.ticker_proxy=document.getElementById("tickerProxy").checked;
  body.ticker_refresh=Number(document.getElementById("tickerRefresh").value);
  body.vps_url=document.getElementById("vps").value;
  body.vps_token=document.getElementById("vpsToken").value;
  body.vps_proxy=document.getElementById("vpsProxy").checked;
  body.vps_refresh=Number(document.getElementById("vpsRefresh").value);
  body.album_id=document.getElementById("album").value;
  body.video_source=document.getElementById("vsource").value;
  body.video_album=document.getElementById("valbum").value;
  body.video_http=document.getElementById("vhttp").value;
  body.video_http_user=document.getElementById("vhttpUser").value;
  body.video_http_pass=document.getElementById("vhttpPass").value;
  body.video_muted=document.getElementById("vmuted").checked;
  body.video_max=Number(document.getElementById("vmax").value)||0;
  body.video_remove=[];
  var dels=document.querySelectorAll(".vdel");
  for(var di=0;di<dels.length;di++) if(dels[di].checked) body.video_remove.push(dels[di].getAttribute("data-name"));
  var nodes=document.querySelectorAll(".page");
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i], pg=body.pages[i];
    pg.enabled=n.querySelector(".en").checked;
    pg.dwell=Number(n.querySelector(".dw").value)||pg.dwell;
    var u=n.querySelector(".url"); if(u) pg.url=u.value;
    var ak=n.querySelector(".akey"); if(ak) pg.api_key=ak.value;
    var md=n.querySelector(".model"); if(md) pg.model=md.value;
    var px=n.querySelector(".px"); if(px) pg.use_proxy=px.checked;
    var rf=n.querySelector(".rf"); if(rf) pg.refresh=Number(rf.value);
  }
  return body;
}
document.getElementById("save").onclick=function(){
  var msg=document.getElementById("msg");
  msg.textContent="正在保存…";
  fetch("/setup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(collect())})
    .then(function(r){return r.text().then(function(t){if(!r.ok) throw new Error(t); return t})})
    .then(function(){msg.textContent="已保存。iPad 会按新设置重新拉取。"})
    .catch(function(){msg.textContent="保存失败，请确认 iPad 上的 App 还开着。"});
};
fetch("/setup.json").then(function(r){return r.json()}).then(function(j){state=j;render()}).catch(function(){
  document.getElementById("app").textContent="读不到 iPad 上的设置。";
});
</script>
</body>
</html>
